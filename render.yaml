databases:
  - name: face-match-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    databaseName: facematch
    user: facematch

services:
  - name: face-match-cache
    type: keyvalue
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - name: face-match-api
    type: web
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: face-match-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: face-match-cache
          property: connectionString
      - key: GDRIVE_SA_JSON
        sync: false
      - key: GDRIVE_FOLDER_ID
        sync: false
      - key: GDRIVE_RECURSIVE
        value: "true"
      - key: INSIGHTFACE_MODEL
        value: buffalo_l
      - key: ONNX_PROVIDERS
        value: CPUExecutionProvider
      - key: MATCH_THRESHOLD
        value: "0.40"
      - key: REVIEW_THRESHOLD
        value: "0.30"
      - key: TOP_K
        value: "3"
      - key: SYNC_INTERVAL_MIN
        value: "30"
      - key: SYNC_BATCH_COMMIT
        value: "50"
      - key: IMAGE_CACHE_TTL_SECONDS
        value: "86400"
      - key: MATCH_RATE_LIMIT
        value: 30/minute
      - key: SYNC_RATE_LIMIT
        value: 5/minute

  - name: face-match-worker
    type: worker
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: rq worker --url $REDIS_URL sync
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: face-match-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: face-match-cache
          property: connectionString
      - key: GDRIVE_SA_JSON
        sync: false
      - key: GDRIVE_FOLDER_ID
        sync: false
      - key: GDRIVE_RECURSIVE
        value: "true"
      - key: INSIGHTFACE_MODEL
        value: buffalo_l
      - key: ONNX_PROVIDERS
        value: CPUExecutionProvider
      - key: SYNC_BATCH_COMMIT
        value: "50"

  - name: face-match-ui
    type: web
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile.ui
    dockerContext: .
    dockerCommand: streamlit run frontend/streamlit_app.py --server.address=0.0.0.0 --server.port=$PORT --browser.gatherUsageStats=false
    autoDeploy: true
    envVars:
      - key: API_BASE_URL
        sync: false
